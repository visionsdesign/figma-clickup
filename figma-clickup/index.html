<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figma → ClickUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F7F5; --surface: #FFFFFF; --border: #E4E4E0; --border-strong: #C9C9C3;
      --text-primary: #1A1A18; --text-secondary: #6B6B65; --text-muted: #9D9D96;
      --accent: #6366F1; --accent-hover: #4F52D4; --accent-light: #EEF2FF; --accent-text: #3730A3;
      --success-bg: #F0FDF4; --success-text: #166534; --success-border: #BBF7D0;
      --error-bg: #FEF2F2; --error-text: #991B1B; --error-border: #FECACA;
      --warning-bg: #FFFBEB; --warning-text: #92400E; --warning-border: #FDE68A;
      --info-bg: #EFF6FF; --info-text: #1E40AF; --info-border: #BFDBFE;
      --radius: 8px; --radius-lg: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; font-size: 14px; line-height: 1.5; }

    /* Topbar */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .brand-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
    .brand-icon svg { width: 16px; height: 16px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .version-tag { font-size: 11px; font-weight: 500; background: var(--accent-light); color: var(--accent-text); padding: 3px 9px; border-radius: 99px; }

    /* Layout */
    .layout { display: flex; min-height: calc(100vh - 56px); }
    .sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
    .main { flex: 1; padding: 28px 28px 64px; max-width: 780px; }

    /* Sidebar */
    .sidebar-section { padding: 0 14px; margin-bottom: 20px; }
    .sidebar-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 6px; margin-bottom: 6px; }
    .project-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; transition: background 0.12s; font-size: 13px; color: var(--text-secondary); position: relative; }
    .project-item:hover { background: var(--bg); }
    .project-item.active { background: var(--accent-light); color: var(--accent-text); font-weight: 500; }
    .project-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .project-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-count { font-size: 11px; background: var(--border); color: var(--text-muted); padding: 1px 6px; border-radius: 99px; }
    .project-item.active .project-count { background: rgba(99,102,241,0.15); color: var(--accent-text); }
    .add-project-btn { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text-muted); border: 1.5px dashed var(--border-strong); margin: 0 14px; background: transparent; width: calc(100% - 28px); font-family: inherit; transition: all 0.12s; }
    .add-project-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .card.locked { opacity: 0.45; pointer-events: none; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-header-left { display: flex; align-items: center; gap: 10px; }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-light); color: var(--accent-text); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card-title { font-size: 14px; font-weight: 600; }

    /* Form */
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    input, select { height: 36px; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 0 11px; font-size: 14px; font-family: inherit; color: var(--text-primary); background: var(--surface); outline: none; width: 100%; transition: border-color 0.15s; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    input::placeholder { color: var(--text-muted); }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }

    /* Buttons */
    .btn { height: 36px; padding: 0 16px; border-radius: var(--radius); font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: all 0.15s; border: none; white-space: nowrap; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-strong); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-danger { background: transparent; border: 1px solid var(--error-border); color: var(--error-text); }
    .btn-danger:hover { background: var(--error-bg); }
    .btn-lg { height: 42px; padding: 0 22px; font-size: 15px; }

    /* Status */
    .status { display: flex; align-items: flex-start; gap: 8px; padding: 10px 13px; border-radius: var(--radius); font-size: 13px; margin-top: 12px; line-height: 1.5; }
    .status svg { flex-shrink: 0; margin-top: 1px; }
    .s-info    { background: var(--info-bg);    color: var(--info-text);    border: 1px solid var(--info-border); }
    .s-success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
    .s-error   { background: var(--error-bg);   color: var(--error-text);   border: 1px solid var(--error-border); }
    .s-warning { background: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* Tabs */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .tab { padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 6px; transition: all 0.12s; }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-badge { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--border); color: var(--text-muted); }
    .tab.active .tab-badge { background: var(--accent-light); color: var(--accent-text); }
    .tab-badge.new { background: #FEF3C7; color: #92400E; }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .filters { display: flex; gap: 5px; }
    .filter-btn { font-size: 12px; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-secondary); cursor: pointer; font-family: inherit; transition: all 0.12s; }
    .filter-btn:hover { background: var(--bg); }
    .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .sel-actions { display: flex; align-items: center; gap: 8px; }
    .sel-count { font-size: 13px; color: var(--text-secondary); }
    .mini-btn { font-size: 12px; padding: 3px 10px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: transparent; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .mini-btn:hover { background: var(--bg); }

    /* Comment cards */
    .comment-list { display: flex; flex-direction: column; gap: 6px; max-height: 380px; overflow-y: auto; padding-right: 2px; }
    .comment-list::-webkit-scrollbar { width: 4px; }
    .comment-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
    .ccard { border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; display: flex; gap: 10px; cursor: pointer; transition: border-color 0.12s, background 0.12s; user-select: none; }
    .ccard:hover { border-color: var(--border-strong); background: var(--bg); }
    .ccard.selected { border-color: var(--accent); background: var(--accent-light); }
    .ccard.synced { opacity: 0.65; }
    .checkbox { width: 18px; height: 18px; border: 1.5px solid var(--border-strong); border-radius: 5px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
    .ccard.selected .checkbox { background: var(--accent); border-color: var(--accent); }
    .cbody { flex: 1; min-width: 0; }
    .ctext { font-size: 14px; color: var(--text-primary); line-height: 1.45; }
    .cmeta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--text-muted); align-items: center; }
    .cmeta-item { display: flex; align-items: center; gap: 4px; }
    .badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; }
    .badge-open     { background: var(--warning-bg); color: var(--warning-text); }
    .badge-resolved { background: var(--success-bg); color: var(--success-text); }
    .badge-synced   { background: var(--info-bg); color: var(--info-text); }
    .empty { text-align: center; padding: 28px 16px; color: var(--text-muted); font-size: 14px; }

    /* Results */
    .result-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .result-item:last-child { border-bottom: none; }
    .result-name { flex: 1; min-width: 0; }
    .result-title { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-sub   { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    .result-link  { font-size: 12px; color: var(--accent); white-space: nowrap; text-decoration: none; display: flex; align-items: center; gap: 3px; }
    .result-link:hover { text-decoration: underline; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; display: flex; align-items: center; justify-content: center; }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; width: 480px; max-width: calc(100vw - 32px); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* Spinner */
    .spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.65s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    @media (max-width: 640px) {
      .sidebar { display: none; }
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    Figma → ClickUp
  </div>
  <div class="topbar-right">
    <span class="version-tag">v2.0</span>
  </div>
</nav>

<div class="layout">
  <!-- Sidebar: project switcher -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Projects</div>
      <div id="projectList"></div>
    </div>
    <button class="add-project-btn" onclick="openAddProject()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Add project
    </button>
  </aside>

  <!-- Main content -->
  <main class="main" id="mainContent">
    <div class="empty-state">
      <h3>No project selected</h3>
      <p>Add a project using the sidebar to get started.<br/>Each project saves its Figma file and ClickUp list separately.</p>
    </div>
  </main>
</div>

<!-- Add / Edit Project Modal -->
<div class="modal-overlay hidden" id="projectModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add project</div>
    <div class="field">
      <label>Project name</label>
      <input type="text" id="modalName" placeholder="e.g. Cameo Website Redesign" />
    </div>
    <div class="field">
      <label>Figma file URL</label>
      <input type="text" id="modalFigma" placeholder="https://figma.com/design/abc123/My-File" />
    </div>
    <div class="field">
      <label>ClickUp list ID</label>
      <input type="text" id="modalClickup" placeholder="e.g. 901234567" />
    </div>
    <div class="field">
      <label>Project colour</label>
      <input type="color" id="modalColor" value="#6366F1" style="height:36px;padding:2px 6px;cursor:pointer;" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="deleteProjectBtn" onclick="deleteProject()" style="display:none">Delete project</button>
      <button class="btn btn-primary" onclick="saveProject()">Save project</button>
    </div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let projects = JSON.parse(localStorage.getItem('fc_projects') || '[]');
let activeProjectId = null;
let editingProjectId = null;

// Per-project state keyed by project id
let projectState = {}; // { [id]: { allComments, syncedIds, selected, lastFetch } }

// ─── Project management ───────────────────────────────────────────────────────
function saveProjects() {
  localStorage.setItem('fc_projects', JSON.stringify(projects));
  // persist synced IDs
  projects.forEach(p => {
    const s = projectState[p.id];
    if (s) localStorage.setItem('fc_synced_' + p.id, JSON.stringify([...s.syncedIds]));
  });
}

function getProjectState(id) {
  if (!projectState[id]) {
    const synced = JSON.parse(localStorage.getItem('fc_synced_' + id) || '[]');
    projectState[id] = { allComments: [], syncedIds: new Set(synced), selected: new Set(), lastFetch: null, filter: 'new', commentTab: 'new' };
  }
  return projectState[id];
}

function renderSidebar() {
  const list = document.getElementById('projectList');
  if (!projects.length) {
    list.innerHTML = `<div style="font-size:13px;color:var(--text-muted);padding:6px 10px">No projects yet</div>`;
    return;
  }
  list.innerHTML = projects.map(p => {
    const s = getProjectState(p.id);
    const newCount = s.allComments.filter(c => !s.syncedIds.has(c.id)).length;
    return `<div class="project-item ${p.id === activeProjectId ? 'active' : ''}" onclick="selectProject('${p.id}')">
      <div class="project-dot" style="background:${p.color}"></div>
      <span class="project-name">${esc(p.name)}</span>
      ${newCount > 0 ? `<span class="project-count">${newCount}</span>` : ''}
      <span onclick="event.stopPropagation();openEditProject('${p.id}')" style="opacity:0.4;font-size:16px;line-height:1;padding:0 2px;cursor:pointer" title="Edit">⋯</span>
    </div>`;
  }).join('');
}

function selectProject(id) {
  activeProjectId = id;
  renderSidebar();
  renderMain();
}

function openAddProject() {
  editingProjectId = null;
  document.getElementById('modalTitle').textContent = 'Add project';
  document.getElementById('modalName').value = '';
  document.getElementById('modalFigma').value = '';
  document.getElementById('modalClickup').value = '';
  document.getElementById('modalColor').value = '#6366F1';
  document.getElementById('deleteProjectBtn').style.display = 'none';
  document.getElementById('projectModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('modalName').focus(), 50);
}

function openEditProject(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  editingProjectId = id;
  document.getElementById('modalTitle').textContent = 'Edit project';
  document.getElementById('modalName').value = p.name;
  document.getElementById('modalFigma').value = p.figmaUrl;
  document.getElementById('modalClickup').value = p.clickupList;
  document.getElementById('modalColor').value = p.color || '#6366F1';
  document.getElementById('deleteProjectBtn').style.display = 'inline-flex';
  document.getElementById('projectModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('projectModal').classList.add('hidden');
}

function saveProject() {
  const name = document.getElementById('modalName').value.trim();
  const figmaUrl = document.getElementById('modalFigma').value.trim();
  const clickupList = document.getElementById('modalClickup').value.trim();
  const color = document.getElementById('modalColor').value;
  if (!name || !figmaUrl || !clickupList) { alert('Please fill in all fields.'); return; }

  if (editingProjectId) {
    const p = projects.find(x => x.id === editingProjectId);
    if (p) { p.name = name; p.figmaUrl = figmaUrl; p.clickupList = clickupList; p.color = color; }
  } else {
    const id = 'proj_' + Date.now();
    projects.push({ id, name, figmaUrl, clickupList, color });
    activeProjectId = id;
  }
  saveProjects();
  closeModal();
  renderSidebar();
  renderMain();
}

function deleteProject() {
  if (!editingProjectId) return;
  if (!confirm('Delete this project? This cannot be undone.')) return;
  projects = projects.filter(p => p.id !== editingProjectId);
  localStorage.removeItem('fc_synced_' + editingProjectId);
  delete projectState[editingProjectId];
  if (activeProjectId === editingProjectId) activeProjectId = projects[0]?.id || null;
  saveProjects();
  closeModal();
  renderSidebar();
  renderMain();
}

// ─── Main content ─────────────────────────────────────────────────────────────
function renderMain() {
  const main = document.getElementById('mainContent');
  if (!activeProjectId) {
    main.innerHTML = `<div class="empty-state"><h3>No project selected</h3><p>Add a project using the sidebar to get started.</p></div>`;
    return;
  }
  const p = projects.find(x => x.id === activeProjectId);
  if (!p) return;
  const s = getProjectState(p.id);

  const newComments = s.allComments.filter(c => !s.syncedIds.has(c.id));
  const syncedComments = s.allComments.filter(c => s.syncedIds.has(c.id));

  main.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <h1 style="font-size:20px;font-weight:600">${esc(p.name)}</h1>
        <div style="font-size:13px;color:var(--text-muted);margin-top:2px">${s.lastFetch ? 'Last fetched ' + s.lastFetch : 'Not yet fetched'}</div>
      </div>
      <button class="btn btn-primary" id="fetchBtn" onclick="fetchComments()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7a6 6 0 1 0 6-6A6 6 0 0 0 2.76 2.76M1 2.5V5h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Fetch comments
      </button>
    </div>

    <div id="fetchStatus"></div>

    ${s.allComments.length > 0 ? `
    <!-- Comment tabs -->
    <div class="card" style="margin-bottom:16px">
      <div class="tabs">
        <div class="tab ${s.commentTab === 'new' ? 'active' : ''}" onclick="setCommentTab('new')">
          New
          <span class="tab-badge new">${newComments.length}</span>
        </div>
        <div class="tab ${s.commentTab === 'synced' ? 'active' : ''}" onclick="setCommentTab('synced')">
          Synced to ClickUp
          <span class="tab-badge">${syncedComments.length}</span>
        </div>
        <div class="tab ${s.commentTab === 'all' ? 'active' : ''}" onclick="setCommentTab('all')">
          All
          <span class="tab-badge">${s.allComments.length}</span>
        </div>
      </div>

      <div class="toolbar">
        <div class="filters">
          <button class="filter-btn ${s.filter === 'all' ? 'active' : ''}" onclick="setFilter('all',this)">All</button>
          <button class="filter-btn ${s.filter === 'open' ? 'active' : ''}" onclick="setFilter('open',this)">Open</button>
          <button class="filter-btn ${s.filter === 'resolved' ? 'active' : ''}" onclick="setFilter('resolved',this)">Resolved</button>
        </div>
        <div class="sel-actions">
          <span class="sel-count" id="selCount">${s.selected.size} selected</span>
          <button class="mini-btn" onclick="selectAll()">Select all</button>
          <button class="mini-btn" onclick="clearAll()">Clear</button>
        </div>
      </div>
      <div class="comment-list" id="commentList"></div>
    </div>

    <!-- ClickUp options -->
    <div class="card" id="clickupCard">
      <div class="card-header">
        <div class="card-header-left">
          <div class="step-num">2</div>
          <div class="card-title">ClickUp options</div>
        </div>
        <div style="font-size:12px;color:var(--text-muted)">List: ${esc(p.clickupList)}</div>
      </div>
      <div class="row">
        <div class="field">
          <label>Assignee (ClickUp username or email)</label>
          <input type="text" id="assigneeInput" placeholder="e.g. dom@visionsdesign.co.uk" />
        </div>
        <div class="field">
          <label>Due date (optional)</label>
          <input type="date" id="dueDateInput" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Priority</label>
          <select id="priorityInput">
            <option value="">No priority</option>
            <option value="1">🔴 Urgent</option>
            <option value="2">🟠 High</option>
            <option value="3" selected>🔵 Normal</option>
            <option value="4">⚪ Low</option>
          </select>
        </div>
        <div class="field">
          <label>Tag (optional)</label>
          <input type="text" id="tagInput" placeholder="figma-feedback" />
        </div>
      </div>
      <div class="field">
        <label>Resolve Figma comment after creating task?</label>
        <select id="resolveInput">
          <option value="no">No — leave open in Figma</option>
          <option value="yes">Yes — mark as resolved in Figma</option>
        </select>
      </div>
      <div style="margin-top:16px;display:flex;align-items:center;gap:14px">
        <button class="btn btn-primary btn-lg" id="createBtn" onclick="createTasks()" disabled>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Push to ClickUp
        </button>
        <span id="createHint" style="font-size:13px;color:var(--text-muted)">Select comments above first</span>
      </div>
    </div>
    ` : `<div class="card"><div class="empty">Click "Fetch comments" to load Figma comments for this project.</div></div>`}

    <div id="createResults"></div>
  `;

  renderCommentList();
  updateCreateBtn();
}

// ─── Comment tabs & filters ───────────────────────────────────────────────────
function setCommentTab(tab) {
  const s = getProjectState(activeProjectId);
  s.commentTab = tab;
  renderMain();
}

function setFilter(f) {
  const s = getProjectState(activeProjectId);
  s.filter = f;
  renderMain();
}

function visibleComments() {
  const s = getProjectState(activeProjectId);
  let base = s.allComments;
  if (s.commentTab === 'new')    base = base.filter(c => !s.syncedIds.has(c.id));
  if (s.commentTab === 'synced') base = base.filter(c => s.syncedIds.has(c.id));
  if (s.filter === 'open')     base = base.filter(c => !c.resolved_at);
  if (s.filter === 'resolved') base = base.filter(c => !!c.resolved_at);
  return base;
}

function renderCommentList() {
  const listEl = document.getElementById('commentList');
  if (!listEl) return;
  const s = getProjectState(activeProjectId);
  const visible = visibleComments();

  if (!visible.length) {
    listEl.innerHTML = `<div class="empty">${s.commentTab === 'synced' ? 'No comments synced yet.' : s.commentTab === 'new' ? 'No new comments — all caught up!' : 'No comments match this filter.'}</div>`;
    return;
  }

  listEl.innerHTML = visible.map(c => {
    const isSel = s.selected.has(c.id);
    const isSynced = s.syncedIds.has(c.id);
    const resolved = !!c.resolved_at;
    const author = c.user?.handle || c.user?.name || 'Unknown';
    const date = c.created_at ? new Date(c.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

    return `<div class="ccard ${isSel ? 'selected' : ''} ${isSynced ? 'synced' : ''}" onclick="toggleComment('${esc(c.id)}')" role="checkbox" aria-checked="${isSel}" tabindex="0">
      <div class="checkbox">${isSel ? `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-4.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}</div>
      <div class="cbody">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div class="ctext">${esc(c.message)}</div>
          <div style="display:flex;gap:4px;flex-shrink:0">
            ${isSynced ? `<span class="badge badge-synced">Synced</span>` : ''}
            <span class="badge ${resolved ? 'badge-resolved' : 'badge-open'}">${resolved ? 'Resolved' : 'Open'}</span>
          </div>
        </div>
        <div class="cmeta">
          <span class="cmeta-item">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="4" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 10.5c0-2.21 2.01-4 4.5-4s4.5 1.79 4.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            ${esc(author)}
          </span>
          ${date ? `<span class="cmeta-item"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M4 1v2M8 1v2M1 5h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>${date}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleComment(id) {
  const s = getProjectState(activeProjectId);
  s.selected.has(id) ? s.selected.delete(id) : s.selected.add(id);
  renderCommentList();
  updateCreateBtn();
  const el = document.getElementById('selCount');
  if (el) el.textContent = `${s.selected.size} selected`;
}

function selectAll() {
  const s = getProjectState(activeProjectId);
  visibleComments().forEach(c => s.selected.add(c.id));
  renderCommentList(); updateCreateBtn();
  const el = document.getElementById('selCount'); if (el) el.textContent = `${s.selected.size} selected`;
}

function clearAll() {
  const s = getProjectState(activeProjectId);
  visibleComments().forEach(c => s.selected.delete(c.id));
  renderCommentList(); updateCreateBtn();
  const el = document.getElementById('selCount'); if (el) el.textContent = `${s.selected.size} selected`;
}

function updateCreateBtn() {
  const s = activeProjectId ? getProjectState(activeProjectId) : null;
  const btn = document.getElementById('createBtn');
  const hint = document.getElementById('createHint');
  if (!btn) return;
  const count = s ? s.selected.size : 0;
  btn.disabled = count === 0;
  if (hint) hint.textContent = count === 0 ? 'Select comments above first' : `${count} comment${count !== 1 ? 's' : ''} → ClickUp`;
}

// ─── Fetch comments ───────────────────────────────────────────────────────────
function extractFileKey(input) {
  const m = input.match(/figma\.com\/(?:design|file|proto)\/([a-zA-Z0-9]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9]{10,}$/.test(input.trim())) return input.trim();
  return null;
}

async function fetchComments() {
  const p = projects.find(x => x.id === activeProjectId);
  if (!p) return;
  const s = getProjectState(p.id);
  const btn = document.getElementById('fetchBtn');
  const statusEl = document.getElementById('fetchStatus');

  const fileKey = extractFileKey(p.figmaUrl);
  if (!fileKey) { statusEl.innerHTML = statusHtml('error', 'Could not read file key from the Figma URL saved for this project. Edit the project to fix it.'); return; }

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Fetching…`;
  statusEl.innerHTML = statusHtml('info', 'Fetching comments from Figma…');

  try {
    const res = await fetch(`/api/figma-comments?fileKey=${fileKey}`);
    const data = await res.json();
    if (!res.ok) { statusEl.innerHTML = statusHtml('error', data.error || 'Failed to fetch.'); return; }

    const incoming = data.comments || [];

    // Merge: keep existing, add new ones
    const existingIds = new Set(s.allComments.map(c => c.id));
    const brandNew = incoming.filter(c => !existingIds.has(c.id));

    // Update all comments (refresh existing data too)
    s.allComments = incoming;
    s.lastFetch = new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    saveProjects();
    renderMain();

    const newCount = incoming.filter(c => !s.syncedIds.has(c.id)).length;
    const statusDiv = document.getElementById('fetchStatus');
    if (statusDiv) {
      statusDiv.innerHTML = statusHtml('success',
        brandNew.length > 0
          ? `Fetched ${incoming.length} comments — ${brandNew.length} new since last fetch.`
          : `Fetched ${incoming.length} comments — no new comments since last fetch.`
      );
    }
  } catch (err) {
    statusEl.innerHTML = statusHtml('error', `Network error: ${err.message}`);
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7a6 6 0 1 0 6-6A6 6 0 0 0 2.76 2.76M1 2.5V5h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Fetch comments`;
  }
}

// ─── Create tasks ─────────────────────────────────────────────────────────────
async function createTasks() {
  const p = projects.find(x => x.id === activeProjectId);
  if (!p) return;
  const s = getProjectState(p.id);

  const assignee = document.getElementById('assigneeInput')?.value.trim() || '';
  const dueDate = document.getElementById('dueDateInput')?.value || '';
  const priority = document.getElementById('priorityInput')?.value || '';
  const tag = document.getElementById('tagInput')?.value.trim() || '';
  const resolveOnCreate = document.getElementById('resolveInput')?.value === 'yes';
  const btn = document.getElementById('createBtn');
  const resultsEl = document.getElementById('createResults');

  const toCreate = s.allComments.filter(c => s.selected.has(c.id));
  if (!toCreate.length) return;

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Creating…`;
  if (resultsEl) resultsEl.innerHTML = '';

  const fileKey = extractFileKey(p.figmaUrl);

  const tasks = toCreate.map(c => {
    const author = c.user?.handle || c.user?.name || 'Unknown';
    const figmaLink = fileKey ? `https://figma.com/design/${fileKey}?comment-id=${c.id}` : '';
    const body = {
      commentId: c.id,
      name: c.message.length > 80 ? c.message.slice(0, 77) + '…' : c.message,
      description: `**Figma comment** by ${author}\n\n${c.message}${figmaLink ? `\n\n[View in Figma](${figmaLink})` : ''}`,
      priority: priority ? parseInt(priority) : null,
      tags: tag ? [tag.toLowerCase().replace(/\s+/g, '-')] : [],
      assignee: assignee || null,
      dueDate: dueDate ? new Date(dueDate).getTime() : null
    };
    return body;
  });

  try {
    const res = await fetch('/api/clickup-tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ listId: p.clickupList, tasks })
    });
    const data = await res.json();
    if (!res.ok) { if (resultsEl) resultsEl.innerHTML = `<div class="card">${statusHtml('error', data.error || 'Failed.')}</div>`; return; }

    const taskResults = data.results || [];
    const successes = taskResults.filter(r => r.success);
    const failures  = taskResults.filter(r => !r.success);

    // Mark successfully synced comments
    successes.forEach(r => { s.syncedIds.add(r.commentId); s.selected.delete(r.commentId); });
    saveProjects();

    // Optionally resolve in Figma
    if (resolveOnCreate && successes.length && fileKey) {
      for (const sr of successes) {
        await fetch('/api/figma-resolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fileKey, commentId: sr.commentId }) }).catch(() => {});
      }
    }

    renderMain();
    renderResults(successes, failures, toCreate);
  } catch (err) {
    if (resultsEl) resultsEl.innerHTML = `<div class="card">${statusHtml('error', `Network error: ${err.message}`)}</div>`;
  }

  const btnEl = document.getElementById('createBtn');
  if (btnEl) { btnEl.disabled = false; btnEl.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Push to ClickUp`; }
}

function renderResults(successes, failures, original) {
  const resultsEl = document.getElementById('createResults');
  if (!resultsEl) return;
  const total = successes.length + failures.length;
  let html = `<div class="card"><div class="card-header" style="margin-bottom:12px"><div class="step-num" style="background:#F0FDF4;color:#166534">✓</div><div class="card-title">${successes.length} of ${total} tasks created in ClickUp</div></div>`;
  if (successes.length) {
    html += successes.map(r => `<div class="result-item">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-top:1px"><circle cx="8" cy="8" r="7" stroke="#16a34a" stroke-width="1.3"/><path d="M5 8l2 2 4-4" stroke="#16a34a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="result-name"><div class="result-title">${esc(r.taskName)}</div><div class="result-sub">ID: ${r.taskId}</div></div>
      ${r.taskUrl ? `<a href="${esc(r.taskUrl)}" class="result-link" target="_blank" rel="noopener">Open <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 9L9 2M9 2H5M9 2v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>` : ''}
    </div>`).join('');
  }
  if (failures.length) {
    html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">`;
    html += failures.map(r => {
      const orig = original.find(c => c.commentId === r.commentId);
      return `<div class="result-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;margin-top:1px"><circle cx="8" cy="8" r="7" stroke="#dc2626" stroke-width="1.3"/><path d="M8 5v3.5M8 10.5v.5" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round"/></svg>
        <div class="result-name"><div class="result-title" style="color:var(--text-secondary)">${esc((orig?.name || 'Unknown').slice(0,60))}</div><div class="result-sub" style="color:var(--error-text)">${esc(r.error)}</div></div>
      </div>`;
    }).join('');
    html += `</div>`;
  }
  html += `</div>`;
  resultsEl.innerHTML = html;
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function statusHtml(type, msg) {
  const icons = {
    info:    `<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M7.5 7v4M7.5 5v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    success: `<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 7.5l2 2 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    error:   `<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M7.5 5v3.5M7.5 10v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    warning: `<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2L14 13H1L7.5 2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M7.5 6v3M7.5 10.5v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`
  };
  return `<div class="status s-${type}">${icons[type]} ${esc(msg)}</div>`;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close modal on overlay click
document.getElementById('projectModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ─── Init ─────────────────────────────────────────────────────────────────────
renderSidebar();
renderMain();
</script>
